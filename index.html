<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open This 💗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #ff5f7e;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hi 💕</h1>
    <p>This song is for you.  
    Please listen while reading this page.</p>

    <iframe
      style="border-radius:12px"
      src="https://open.spotify.com/embed/track/1ctbkptXLNIoEVTNAFYV4d?utm_source=generator"
      width="100%"
      height="152"
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
